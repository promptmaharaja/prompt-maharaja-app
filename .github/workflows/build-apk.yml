name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name "prompt-maharaja-app*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP" -d /tmp/app
          cp -r /tmp/app/prompt_maharaja/. .
          rm -f "$ZIP"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptMaharaja-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          
