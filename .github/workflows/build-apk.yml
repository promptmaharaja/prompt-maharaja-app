name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -name "prompt-maharaja-app*.zip" | head -1)
          echo "Found zip: $ZIP"
          unzip -o "$ZIP" -d /tmp/app
          mv /tmp/app/* "$GITHUB_WORKSPACE"
          ls "$GITHUB_WORKSPACE"
      - name: Fix Android config
        run: |
          cd "$GITHUB_WORKSPACE/prompt_maharaja"
          printf 'org.gradle.jvmargs=-Xmx4G\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n' > android/gradle.properties
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "25.1.8937393"/' android/app/build.gradle
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">\n        <item name="android:windowBackground">@android:color/black</item>\n    </style>\n    <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">\n        <item name="android:windowBackground">@android:color/black</item>\n    </style>\n</resources>\n' > android/app/src/main/res/values/styles.xml
          sed -i 's/ *android:icon="@mipmap\/ic_launcher"//' android/app/src/main/AndroidManifest.xml
          echo "ALL FIXES APPLIED"
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - name: Get packages
        run: |
          cd "$GITHUB_WORKSPACE/prompt_maharaja"
          flutter pub get
      - name: Build debug APK
        run: |
          cd "$GITHUB_WORKSPACE/prompt_maharaja"
          flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PromptMaharaja-APK
          path: prompt_maharaja/build/app/outputs/flutter-apk/app-debug.apk
          
